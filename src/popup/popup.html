<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>StreamGrab</title>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="dot"></span>
        <strong>StreamGrab</strong>
      </div>
      <button id="clear" class="ghost" title="Clear detected list for this tab">Clear</button>
    </header>

    <div class="controls">
      <label class="qlabel" for="quality">Quality</label>
      <select id="quality">
        <option value="best">Best available</option>
        <option value="1080">Up to 1080p</option>
        <option value="720">Up to 720p</option>
        <option value="audio">Audio only (mp3)</option>
      </select>
    </div>

    <button id="page" class="primary">⬇ Download this page's video</button>

    <div class="section-label">Detected on this page</div>
    <main id="list" class="list" aria-live="polite"></main>
    <p id="empty" class="empty">
      Nothing extra detected — the button above grabs the page's main video
      (YouTube, etc.) via yt-dlp.
    </p>

    <footer class="foot">
      <span id="status" class="hint">engine: checking…</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
