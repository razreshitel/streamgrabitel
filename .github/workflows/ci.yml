name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check all JS
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done
      - name: Run tests
        run: node --test
